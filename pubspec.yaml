name: dashboard_app
description: EV Motorcycle Smart Telemetry, Dual-Battery BMS Diagnostics & Navigation Cockpit built for AndroidIDE.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  http: ^1.2.2
  intl: any
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  flutter_blue_plus: ^1.34.5
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.0
  wakelock_plus: ^1.2.8
  share_plus: ^10.1.2
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  image: ^4.3.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
