name: dashboard_app
description: EV Motorcycle Smart Telemetry, Dual-Battery BMS Diagnostics & Navigation Cockpit built for AndroidIDE.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  intl: any
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
